name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute release version from tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must match vMAJOR.MINOR.PATCH (got $TAG)"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
              echo "::error::MINOR/PATCH must each be 0-99 for the versionCode scheme (got $VERSION)"
              exit 1
            fi
            echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          else
            # Manual workflow_dispatch run on a branch, not a real release tag.
            echo "version_name=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "version_code=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (ktlint)
        run: ./gradlew ktlintCheck

      - name: Run unit tests
        run: ./gradlew :popp-sdk:testAndroidHostTest :popp-demo:shared:testAndroidHostTest :popp-demo:popp-3rd-party-app-demo:shared3rdPartyApp:testAndroidHostTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: |
            popp-sdk/build/reports/tests/
            popp-demo/shared/build/reports/tests/
            popp-demo/popp-3rd-party-app-demo/shared3rdPartyApp/build/reports/tests/

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore.jks" >> "$GITHUB_ENV"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore.jks"

      - name: TEMP DEBUG - verify secret lengths and keystore checksum (no secret values printed)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "ANDROID_KEYSTORE_PASSWORD length: ${#ANDROID_KEYSTORE_PASSWORD}"
          echo "ANDROID_KEY_PASSWORD length: ${#ANDROID_KEY_PASSWORD}"
          echo "Decoded keystore SHA-256:"
          shasum -a 256 "$RUNNER_TEMP/release.keystore.jks"

      - name: Build signed release AAB (pu flavor)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ needs.test.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.test.outputs.version_code }}
        run: ./gradlew :popp-demo:popp-3rd-party-app-demo:android3rdPartyApp:bundlePuRelease

      - name: Upload signed AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android3rdPartyApp-pu-release-aab
          path: popp-demo/popp-3rd-party-app-demo/android3rdPartyApp/build/outputs/bundle/puRelease/*.aab

      - name: Clean up decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore.jks"

  build-ios:
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run iOS simulator tests
        run: ./gradlew :popp-sdk:iosSimulatorArm64Test

      - name: Create temporary CI keychain
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" ci-release.keychain
          security set-keychain-settings -lut 21600 ci-release.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ci-release.keychain
          security list-keychains -d user -s ci-release.keychain $(security list-keychains -d user | sed 's/"//g')

      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k ci-release.keychain -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" ci-release.keychain
          rm -f "$CERT_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision
          rm -f "$PROFILE_PATH" "$RUNNER_TEMP/profile.plist"

      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          echo "APP_STORE_CONNECT_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive, export, and upload signed IPA
        env:
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          RELEASE_VERSION_NAME: ${{ needs.test.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ needs.test.outputs.version_code }}
        run: ./gradlew :xcodeArchiveIos3rdPartyApp :xcodeExportIpaIos3rdPartyApp

      - name: Upload archive + IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-3rd-party-release
          path: |
            build/ios-release/export/
            build/ios-release/iosApp.xcarchive/

      - name: Clean up CI keychain and decoded secrets
        if: always()
        run: |
          security delete-keychain ci-release.keychain || true
          rm -f "$RUNNER_TEMP/dist_cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/AuthKey.p8"
